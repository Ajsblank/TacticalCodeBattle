# git action workflow name
name: Deploy(dev/server)
# executing name, can use environment variables
run-name: "CD actor : ${{github.actor}}"
# Controls when the workflow will run
on:
  push:
    branches: ["dev/server"]
    paths:
      - 'server/**'
      - '.github/workflows/cd-server.yml'

jobs:
  server:
    permissions: 
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env: 
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_URL: ${{ secrets.DB_URL }}
      JWT_TOKEN: ${{secrets.JWT_TOKEN}}
      REDIS_HOST: ${{secrets.REDIS_HOST}}
      REDIS_PORT: ${{secrets.REDIS_PORT}}
      GMAIL_EMAIL: ${{secrets.GMAIL_EMAIL}}
      GMAIL_PASSWORD: ${{secrets.GMAIL_PASSWORD}}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      OCI_HOST: ${{ secrets.OCI_HOST }}
      
    steps:
      - uses: actions/checkout@v4
      - name: set up jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
     
      - name: add permission to execute
        run: chmod +x gradlew 

      - name: server test
        run: ./gradlew test

      - name: server build
        run: ./gradlew build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 image
        run: |
          docker buildx build --platform linux/arm64 \
            -t asap-tcb-server:${{ github.sha }} --load .

      - name: Deploy to OCI
        env:
          IMAGE: asap-tcb-server:${{ github.sha }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan "$OCI_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/oci_key opc@$OCI_HOST"

          echo "이미지 전송..."
          docker save "$IMAGE" | gzip | $SSH "gunzip | docker load"

          echo ".env 작성..."
          cat <<EOF | $SSH "mkdir -p ~/app && umask 077 && cat > ~/app/.env"
          DB_URL=$DB_URL
          DB_NAME=$DB_NAME
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          REDIS_HOST=$REDIS_HOST
          REDIS_PORT=$REDIS_PORT
          JWT_TOKEN=$JWT_TOKEN
          GMAIL_EMAIL=$GMAIL_EMAIL
          GMAIL_PASSWORD=$GMAIL_PASSWORD
          CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
          EOF

          echo "deploy.sh 실행..."
          $SSH "bash -s -- $IMAGE" < deploy.sh
     

     